<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacak Times - Word & Logic Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --bg-secondary: #12121a;
            --primary: #00d4aa;
            --secondary: #ff6b6b;
            --accent: #7b2cbf;
            --muted: #6e6e8e;
            --text: #e8e8f0;
            --text-secondary: #a8a8c8;
            --card: #1a1a24;
            --border: #2a2a3a;
            --success: #00d4aa;
            --error: #ff6b6b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
        ::-webkit-scrollbar-button:single-button { display: none; }

        /* Game Selection */
        .game-selector { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .game-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .game-card::before { content: ''; position: absolute; top: 0; left: 0; width: 2px; height: 100%; background: linear-gradient(180deg, transparent, var(--primary)); opacity: 0; transition: opacity 0.3s ease; }
        .game-card::after { content: ''; position: absolute; bottom: 0; right: 0; width: 2px; height: 100%; background: linear-gradient(90deg, transparent, var(--primary)); opacity: 0; transition: opacity 0.3s ease; }
        .game-card:hover { border-color: var(--primary); transform: translateY(-4px) scale(1.02); box-shadow: 0 15px 30px rgba(0, 212, 170, 0.15); }
        .game-card:hover::before, .game-card:hover::after { opacity: 1; }
        .game-card:hover .game-icon { transform: scale(1.1) rotate(3deg); }
        .game-card:hover .game-name { color: var(--primary); }
        .game-icon { width: 56px; height: 56px; margin: 0 auto 0.8rem; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; transition: transform 0.3s ease; }
        .game-name { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text); margin-top: 0.3rem; transition: color 0.3s ease; }
        .game-card:focus { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* Active Game Area */
        .active-game { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; min-height: 500px; position: relative; overflow: hidden; }
        .active-game::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); }
        .loading { text-align: center; padding: 2rem; color: var(--muted); }
        .error { padding: 1rem; color: var(--error); text-align: center; }
        .back-to-games { position: absolute; top: 1rem; left: 1rem; z-index: 10; }

        /* ==========================================
           WORDLE
           ========================================== */
        .wordle-game { max-width: 600px; margin: 0 auto; }
        .wordle-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .wordle-counter { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.05em; }
        .wordle-word { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: var(--primary); font-weight: 700; }
        .word-mask { font-family: 'Orbitron', monospace; font-size: 2.2rem; letter-spacing: 0.2em; margin: 1.5rem 0; min-height: 3rem; display: flex; align-items: center; justify-content: center; }
        .word-mask span { display: inline-block; width: 1.1em; }
        .keyboard { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin: 1rem 0; }
        .keyboard-button { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.3rem; border-radius: 5px; font-family: 'Orbitron', monospace; font-size: 0.65rem; font-weight: 600; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transition: all 0.1s ease; }
        .keyboard-button:hover:not(.disabled) { border-color: var(--primary); background: rgba(0, 212, 170, 0.1); }
        .keyboard-button.selected { background: rgba(0, 212, 170, 0.2); border-color: var(--primary); color: var(--primary); }
        .keyboard-button.correct { background: var(--success); border-color: var(--success); color: #0a0a0f; }
        .keyboard-button.present { background: var(--secondary); border-color: var(--secondary); color: #0a0a0f; }
        .keyboard-button.absent { background: var(--bg); border-color: var(--muted); color: var(--muted); }
        .keyboard-button:active { transform: scale(0.95); }
        .attempts-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin: 0.3rem 0; }
        .attempt-cell { background: var(--bg-secondary); border-radius: 5px; height: 2rem; display: flex; align-items: center; justify-content: center; }
        .attempt-cell .letter { font-family: 'Orbitron', monospace; font-size: 1rem; color: var(--text); }
        .win-message { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; color: var(--success); font-family: 'Orbitron', sans-serif; font-size: 1.5rem; letter-spacing: 0.3em; display: none; z-index: 100; }
        .win-message.visible { display: flex; }
        .loss-message { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; color: var(--error); font-family: 'Orbitron', sans-serif; font-size: 1.5rem; letter-spacing: 0.3em; display: none; z-index: 100; }
        .loss-message.visible { display: flex; }

        /* ==========================================
           SPELLING BEE
           ========================================== */
        .spelling-bee-game { max-width: 500px; margin: 0 auto; }
        .bee-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .center-letter { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 900; color: var(--primary); background: rgba(0, 212, 170, 0.1); padding: 0.3rem 0.6rem; border-radius: 16px; border: 1px solid rgba(0, 212, 170, 0.3); }
        .honeycomb { display: flex; justify-content: center; gap: 5px; margin: 1.5rem 0; flex-wrap: wrap; }
        .honeycomb-cell { width: 38px; height: 38px; background: var(--card); border: 2px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.7rem; letter-spacing: 0.05em; color: var(--text); cursor: pointer; transition: all 0.2s ease; }
        .honeycomb-cell:hover:not(.disabled) { border-color: var(--primary); background: rgba(0, 212, 170, 0.1); }
        .honeycomb-cell.center { border-color: var(--primary); background: var(--primary); color: #0a0a0f; }
        .bee-input-container { margin-top: 1rem; display: flex; gap: 0.5rem; }
        .bee-input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-family: 'Exo 2', sans-serif; transition: border-color 0.2s; }
        .bee-input:focus { outline: none; border-color: var(--primary); }
        .bee-button { background: var(--primary); color: #0a0a0f; border: none; padding: 0 1rem; border-radius: 20px; font-family: 'Orbitron', sans-serif; font-size: 0.65rem; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; }
        .bee-button:hover { background: #00eaa; }
        .results { margin-top: 1rem; padding: 0.8rem; background: var(--bg-secondary); border-radius: 8px; display: none; }
        .results.visible { display: block; }
        .result-item { display: flex; justify-content: space-between; margin: 0.3rem 0; font-size: 0.7rem; }
        .result-item.valid { color: var(--success); }
        .result-item.invalid { color: var(--error); }

        /* ==========================================
           CONNECTIONS
           ========================================== */
        .connections-game { max-width: 700px; margin: 0 auto; }
        .connections-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 5px; margin: 1.5rem 0; }
        .connector-word { background: var(--card); border: 2px solid var(--border); border-radius: 6px; padding: 0.4rem 0.2rem; text-align: center; font-family: 'Orbitron', sans-serif; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.05em; color: var(--text); cursor: pointer; transition: all 0.2s; min-height: 32px; display: flex; align-items: center; justify-content: center; }
        .connector-word.selected { background: rgba(123, 44, 191, 0.2); border-color: var(--accent); color: var(--accent); }
        .connector-word.correct { background: rgba(0, 212, 170, 0.15); border-color: var(--success); color: var(--success); }
        .connections-categories { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); }
        .category-box { background: var(--bg-secondary); border-radius: 8px; padding: 0.8rem; margin-top: 0.5rem; }
        .category-title { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; }
        .category-words { display: flex; flex-wrap: wrap; gap: 0.2rem; }
        .category-word { background: var(--card); padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.55rem; font-family: 'Orbitron', sans-serif; letter-spacing: 0.02em; }

        /* ==========================================
           SUDOKU
           ========================================== */
        .sudoku-game { max-width: 480px; margin: 0 auto; }
        .sudoku-controls { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .sudoku-btn { background: var(--primary); color: #0a0a0f; border: none; width: 36px; height: 36px; border-radius: 6px; font-family: 'Orbitron', sans-serif; font-size: 0.65rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
        .sudoku-btn:hover { background: #00eaa; }
        .sudoku-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 1px; background: var(--bg-secondary); }
        .sudoku-row { display: flex; }
        .sudoku-cell { width: 38px; height: 38px; background: var(--bg-secondary); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', monospace; font-size: 1rem; font-weight: 700; color: var(--text); cursor: pointer; user-select: none; transition: all 0.15s; }
        .sudoku-cell.fixed { background: var(--card); color: var(--muted); cursor: not-allowed; }
        .sudoku-cell:hover:not(.fixed) { background: rgba(0, 212, 170, 0.1); }
        .sudoku-cell.active { background: rgba(0, 212, 170, 0.2); border-color: var(--primary); }
        .sudoku-cell.error { background: rgba(255, 107, 107, 0.15); border-color: var(--error); color: var(--error); }
        .sudoku-btn-check { margin-left: 1rem; }

        /* ==========================================
           MINI CROSSWORD
           ========================================== */
        .crossword-game { max-width: 420px; margin: 0 auto; }
        .crossword-grid { display: grid; grid-template-columns: repeat(5, 42px); gap: 2px; background: var(--bg-secondary); }
        .crossword-cell { background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-size: 0.65rem; font-weight: 600; color: var(--text); user-select: none; min-height: 36px; }
        .crossword-cell.clue { background: var(--primary); color: #0a0a0f; }
        .clues { margin-top: 1rem; }
        .clues h4 { font-family: 'Orbitron', sans-serif; font-size: 0.55rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin: 0.2rem 0; }
        .clues div { margin: 0.1rem 0; font-size: 0.55rem; }

        /* ==========================================
           2048
           ========================================== */
        .twenty48-game { max-width: 360px; margin: 0 auto; }
        .twenty48-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 1rem 0; }
        .twenty48-tile { background: linear-gradient(135deg, #x20, #x40, #x80, #x160); color: #0a0a0f; border-radius: 8px; padding: 0.5rem; font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; min-height: 44px; transition: transform 0.15s; }
        .twenty48-tile:hover { transform: scale(1.05); }
        .twenty48-controls { display: flex; justify-content: center; gap: 0.3rem; }
        .twenty48-btn { background: var(--primary); color: #0a0a0f; border: none; width: 34px; height: 34px; border-radius: 6px; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
        .twenty48-btn:hover { background: #00eaa; }

        /* ==========================================
           MINESWEEPER
           ========================================== */
        .minesweeper-game { max-width: 500px; margin: 0 auto; }
        .minesweeper-grid { display: grid; gap: 2px; }
        .minesweeper-cell { width: 28px; height: 28px; background: var(--bg-secondary); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-size: 0.55rem; font-weight: 600; cursor: pointer; user-select: none; transition: all 0.15s; position: relative; }
        .minesweeper-cell:hover:not(.revealed) { background: rgba(0, 212, 170, 0.1); }
        .minesweeper-cell.revealed { background: var(--card); }
        .minesweeper-cell.mine { background: var(--error); color: #0a0a0f; }
        .minesweeper-cell.flagged { background: var(--accent); color: #0a0a0f; }
        .minesweeper-cell.number-1 { color: #38bdf8; }
        .minesweeper-cell.number-2 { color: var(--primary); }
        .minesweeper-cell.number-3 { color: var(--accent); }
        .minesweeper-cell.number-4 { color: #a78bfa; }
        .minesweeper-cell.number-5 { color: var(--secondary); }
        .minesweeper-cell.number-6 { color: #06b6d4; }
        .minesweeper-cell.number-7 { color: #64748b; }
        .minesweeper-cell.number-8 { color: #94a3b8; }
        .minesweeper-cell.flagged::after { content '🚩'; position: absolute; font-size: 0.8rem; }
        .mine-count { margin: 0.5rem 0; font-size: 0.7rem; color: var(--muted); text-align: center; }

        /* ==========================================
           MODAL / MODAL STYLE
           ========================================== */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 20; align-items: center; justify-content: center; }
        .modal-overlay.visible { display: flex; }
        .modal-content { background: var(--card); padding: 2rem; border-radius: 10px; text-align: center; color: var(--text); min-width: 250px; }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 640px) {
            .game-selector { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.8rem; }
            .game-card { padding: 1.2rem 0.8rem; }
            .game-icon { width: 44px; height: 44px; font-size: 1.8rem; }
            .game-name { font-size: 0.7rem; }
            .word-mask { font-size: 1.8rem; letter-spacing: 0.2em; }
            .keyboard-button { width: 26px; height: 26px; font-size: 0.55rem; }
            .attempt-cell { height: 1.8rem; }
            .attempt-cell .letter { font-size: 0.8rem; }
            .honeycomb-cell { width: 32px; height: 32px; font-size: 0.65rem; }
            .sudoku-cell { width: 32px; height: 32px; font-size: 0.9rem; }
            .twenty48-tile { padding: 0.3rem; font-size: 0.9rem; min-height: 36px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cacak Times</h1>
        <p>6767676767</p>
    </header>

    <main>
        <section class="game-selector" id="gamesGrid">
            <!-- Games loaded by JavaScript -->
        </section>

        <section class="active-game" id="activeGame">
            <!-- Game UI inserted by JavaScript -->
        </section>
    </main>

    <script>
        // ==========================================
        // CORE SETUP & CONFIGURATION
        // ==========================================

        // Word list for Wordle - only 5-letter words
        const WORD_LIST = [
            "apple", "berry", "cherry", "dragon", "eagle", "grape",
            "honey", "ilium", "jelly", "kangaroo", "lemon", "mango",
            "orange", "peach", "queen", "raspberry", "strawberry",
            "tangerine", "umber", "vanilla", "watermelon", "xenon",
            "yacht", "zebra"
        ];

        // Daily word index based on date
        const dailyWordIndex = () => {
            const today = new Date();
            const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
            return dayOfYear % WORD_LIST.length;
        };

        // Game state management - each game isolated
        let currentGame = null;
        let gameData = {};

        // ==========================================
        // GAME LOGIC IMPLEMENTATIONS
        // ==========================================

        // ==========================================
        // WORDLE LOGIC
        // ==========================================
        function getWordleWord(daily) {
            if (daily) {
                return WORD_LIST[dailyWordIndex()];
            }
            return WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];
        }

        function maskWord(word) {
            return '_'.repeat(word.length);
        }

        function validateWordGuess(word, target) {
            if (word.length !== target.length) return null;
            const result = [];
            const used = [];

            // First pass: greens (correct position)
            for (let i = 0; i < word.length; i++) {
                if (word[i] === target[i]) {
                    result.push('green');
                    used[i] = true;
                } else {
                    result.push('gray');
                }
            }

            // Second pass: yellows (correct letter, wrong position)
            for (let i = 0; i < word.length; i++) {
                if (result[i] === 'green') continue;
                for (let j = 0; j < target.length; j++) {
                    if (!used[j] && word[i] === target[j]) {
                        result[i] = 'yellow';
                        used[j] = true;
                        break;
                    }
                }
            }

            return result;
        }

        // ==========================================
        // SPELLING BEE LOGIC
        // ==========================================
        function generateBeeGrid() {
            const vowels = 'aeiou';
            const consonants = 'bcdfghjklmnpqrstvwxyz';

            const center = vowels[Math.floor(Math.random() * 5)];
            const pickedConsonants = [];
            const tempCons = consonants.split('');
            for (let i = 0; i < 3; i++) {
                const idx = Math.floor(Math.random() * tempCons.length);
                pickedConsonants.push(tempCons.splice(idx, 1)[0]);
            }

            const remainingVowels = vowels.split('').filter(v => v !== center);
            const pickedVowels = [];
            while (pickedVowels.length < 2 && remainingVowels.length > 0) {
                const randIdx = Math.floor(Math.random() * remainingVowels.length);
                pickedVowels.push(remainingVowels.splice(randIdx, 1)[0]);
            }

            const all = [center, ...pickedConsonants, ...pickedVowels];
            for (let i = all.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [all[i], all[j]] = [all[j], all[i]];
            }

            return { grid: all, center };
        }

        function isValidBeeWord(word, grid, center) {
            if (word.length < 4) return { valid: false, reason: 'too_short' };
            if (!word.toLowerCase().includes(center)) return { valid: false, reason: 'no_center' };
            const set = new Set(word.toLowerCase());
            for (const letter of set) {
                if (!grid.includes(letter)) return { valid: false, reason: 'not_in_grid' };
            }
            // Common minimum 4-letter word check
            if (word.length >= 4) return { valid: true };
            return { valid: false, reason: 'too_short' };
        }

        // ==========================================
        // CONNECTIONS LOGIC
        // ==========================================
        // Curated puzzles - each group has semantic meaning
        const curatedPuzzles = [
            {
                words: ["apple", "banana", "carrot", "donut"],
                categories: {
                    YELLOW: "Kitchen items",
                    GREEN: "Types of fruit",
                    BLUE: "Found in a salad",
                    PURPLE: "Words that end in 'e'"
                }
            },
            {
                words: ["cat", "dog", "bird", "fish"],
                categories: {
                    YELLOW: "Pets",
                    GREEN: "Animals",
                    BLUE: "Common household pets",
                    PURPLE: "Words with 3 letters"
                }
            },
            {
                words: ["red", "blue", "green", "yellow"],
                categories: {
                    YELLOW: "Colors",
                    GREEN: "Primary colors",
                    BLUE: "Found in a rainbow",
                    PURPLE: "Basic colors"
                }
            }
        ];

        function getConnectionsWords() {
            const puzzle = curatedPuzzles[Math.floor(Math.random() * curatedPuzzles.length)];
            // Shuffle words but keep categories intact
            const shuffled = [...puzzle.words].sort(() => 0.5 - Math.random);
            return {
                words: shuffled,
                categories: { ...puzzle.categories }
            };
        }

        // ==========================================
        // SUDOKU LOGIC
        // ==========================================
        function generateSudoku() {
            const grid = Array.from({ length: 9 }, () => Array(9).fill(0));

            function isValid(g, row, col, num) {
                for (let i = 0; i < 9; i++) {
                    if (g[row][i] === num || g[i][col] === num) return false;
                }
                const boxRow = 3 * Math.floor(row / 3);
                const boxCol = 3 * Math.floor(col / 3);
                for (let i = boxRow; i < boxRow + 3; i++) {
                    for (let j = boxCol; j < boxCol + 3; j++) {
                        if (g[i][j] === num) return false;
                    }
                }
                return true;
            }

            function solve(g) {
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        if (g[i][j] === 0) {
                            const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => 0.5 - Math.random);
                            for (const num of nums) {
                                if (isValid(g, i, j, num)) {
                                    g[i][j] = num;
                                    if (solve(g)) return true;
                                    g[i][j] = 0;
                                }
                            }
                            return false;
                        }
                    }
                }
                return true;
            }

            // Deep copy solution before modifying
            const solution = grid.map(row => row.map(x => x));
            solve(grid);

            // Create puzzle by removing numbers (keep 35-40 for solvability)
            const puzzle = grid.map(row => row.map(x => x));
            const cells = [];
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    cells.push({ row: i, col: j });
                }
            }
            // Shuffle removal cells
            for (let i = cells.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cells[i], cells[j]] = [cells[j], cells[i]];
            }
            // Remove 40 cells (leave 41 for solvability)
            for (let i = 0; i < 40; i++) {
                const { row, col } = cells[i];
                puzzle[row][col] = 0;
            }

            return { puzzle, solution };
        }

        // ==========================================
        // 2048 LOGIC
        // ==========================================
        function createNew2048Game() {
            const grid = Array.from({ length: 4 }, () => Array(4).fill(0));

            // Add two starting tiles (2 or 4)
            for (let i = 0; i < 2; i++) {
                const empties = [];
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (grid[r][c] === 0) empties.push({ r, c });
                    }
                }
                if (empties.length > 0) {
                    const { r, c } = empties[Math.floor(Math.random() * empties.length)];
                    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
                }
            }

            return {
                grid,
                score: 0,
                hasWon: false,
                gameOver: false
            };
        }

        function move2048(grid, direction) {
            let newGrid = grid.map(r => r.map(x => x));
            let score = 0;
            let hasMoved = false;

            // Normalize direction
            let dr = 0, dc = 0;
            if (direction === 'up') dr = -1;
            else if (direction === 'down') dr = 1;
            else if (direction === 'left') dc = -1;
            else if (direction === 'right') dc = 1;

            if (dr !== 0) {
                // Vertical move
                for (let c = 0; c < 4; c++) {
                    // Collect non-zero values from bottom to top (or top to bottom depending on direction)
                    const col = [];
                    for (let r = 0; r < 4; r++) if (newGrid[r][c] !== 0) col.push(newGrid[r][c]);

                    // Merge
                    const merged = [];
                    let skip = false;
                    for (let i = 0; i < col.length; i++) {
                        if (skip) { skip = false; continue; }
                        if (i < col.length - 1 && col[i] === col[i + 1]) {
                            merged.push(col[i] * 2);
                            score += col[i] * 2;
                            hasMoved = true;
                            skip = true;
                        } else {
                            merged.push(col[i]);
                        }
                    }
                    while (merged.length < 4) merged.unshift(0);

                    // Write back
                    for (let r = 0; r < 4; r++) {
                        if (newGrid[r][c] !== merged[r]) hasMoved = true;
                        newGrid[r][c] = merged[r];
                    }
                }
            } else {
                // Horizontal move
                for (let r = 0; r < 4; r++) {
                    const row = [];
                    for (let c = 0; c < 4; c++) if (newGrid[r][c] !== 0) row.push(newGrid[r][c]);

                    // Merge
                    const merged = [];
                    let skip = false;
                    for (let i = 0; i < row.length; i++) {
                        if (skip) { skip = false; continue; }
                        if (i < row.length - 1 && row[i] === row[i + 1]) {
                            merged.push(row[i] * 2);
                            score += row[i] * 2;
                            hasMoved = true;
                            skip = true;
                        } else {
                            merged.push(row[i]);
                        }
                    }
                    while (merged.length < 4) merged.unshift(0);

                    // Write back
                    for (let c = 0; c < 4; c++) {
                        if (newGrid[r][c] !== merged[c]) hasMoved = true;
                        newGrid[r][c] = merged[c];
                    }
                }
            }

            return {
                grid: newGrid,
                score,
                hasMoved,
                hasWon: check2048Win(newGrid)
            };
        }

        function check2048Win(grid) {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 2048) return true;
                }
            }
            return false;
        }

        function check2048GameOver(grid) {
            // Check if any moves are possible
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) return false;
                    if (c < 3 && grid[r][c] === grid[r][c + 1]) return false;
                    if (r < 3 && grid[r][c] === grid[r + 1][c]) return false;
                }
            }
            return true;
        }

        // ==========================================
        // MINESWEEPER LOGIC
        // ==========================================
        function createMinesweeperGame(size = 9, numMines = 10) {
            const grid = Array.from({ length: size }, () => Array(size).fill(0));
            const minePositions = new Set();

            // Place mines randomly
            while (minePositions.size < numMines) {
                const r = Math.floor(Math.random() * size);
                const c = Math.floor(Math.random() * size);
                minePositions.add(`${r},${c}`);
            }

            // Set mine values
            for (const [r, c] of minePositions) {
                grid[r][c] = -1;
            }

            // Calculate numbers
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] !== -1) {
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                if (dr === 0 && dc === 0) continue;
                                const nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < size && nc >= 0 && nc < size && grid[nr][nc] === -1) count++;
                            }
                        }
                        grid[r][c] = count;
                    }
                }
            }

            return {
                grid,
                size,
                revealed: new Set(),
                flags: new Set(),
                gameOver: false,
                won: false
            };
        }

        function revealCell(game, key) {
            const [r, c] = key.split(',').map(Number);
            const grid = game.grid;
            const revealed = game.revealed;
            const flags = game.flags;
            const isMine = grid[r][c] === -1;

            // Can't reveal if flagged or game over
            if (flags.has(key) || game.gameOver) return game;

            revealed.add(key);
            game.revealed = revealed;

            if (isMine) {
                game.gameOver = true;
                game.won = false;
                return game;
            }

            // If zero adjacent mines, reveal neighbors recursively
            if (grid[r][c] === 0) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < game.size && nc >= 0 && nc < game.size) {
                            const neighborKey = `${nr},${nc}`;
                            if (!revealed.has(neighborKey) && !flags.has(neighborKey)) {
                                revealCell(game, neighborKey);
                            }
                        }
                    }
                }
            }

            game.revealed = revealed;
            return game;
        }

        function toggleFlag(game, key) {
            const flags = game.flags;
            if (flags.has(key)) {
                flags.delete(key);
            } else {
                flags.add(key);
            }
            game.flags = flags;
            return game;
        }

        function checkWin(game) {
            const { grid, size, revealed } = game;
            let safeRevealed = 0;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] === -1) continue;
                    safeRevealed++;
                }
            }
            // Player wins when all non-mine cells are revealed
            const totalSafe = size * size - game.grid.filter(row => row.includes(-1)).flat().length;
            let revealedSafe = 0;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] !== -1 && revealed.has(`${r},${c}`)) revealedSafe++;
                }
            }
            return revealedSafe >= totalSafe;
        }

        function submitWordleGuess() {
            const row = document.querySelectorAll('.attempts-row')[gameData.attempts];
            if (!row) return;

            const guess = Array.from(row.querySelectorAll('.letter'))
                .map(c => c.textContent)
                .join('');

                alert('Must be a 5-letter word');
                return;

            const result = validateWordGuess(guess, gameData.word);
            gameData = { ...gameData, attempts: gameData.attempts + 1 };

            // Update UI

            attemptRow.innerHTML = '';

            result.forEach((type, i) => {
                const cell = document.createElement('div');
                cell.className = `letter ${type}`;
                cell.textContent = guess[i];
                attemptRow.appendChild(cell);
            });

            // Update mask
            const newMask = updateMask(guess, gameData.word);
            document.getElementById('wordMask').textContent = newMask;

            // Check win/loss
            if (guess === gameData.word) {
                showMessage('win-message', '🎉 You guessed it! The word was ' + gameData.word);
            } else if (gameData.attempts >= gameData.maxAttempts) {
                showMessage('loss-message', '💥 Game over! The word was ' + gameData.word);
            }
        }

        function updateMask(guess, target) {
            if (guess.length !== target.length) return '_'.repeat(target.length);
            const result = [];
            const used = [];

            // First pass: greens
            for (let i = 0; i < guess.length; i++) {
                if (guess[i] === target[i]) {
                    result.push('green');
                    used[i] = true;
                } else {
                    result.push('gray');
                }
            }

            // Second pass: yellows
            for (let i = 0; i < guess.length; i++) {
                if (result[i] === 'green') continue;
                for (let j = 0; j < target.length; j++) {
                    if (!used[j] && guess[i] === target[j]) {
                        result[i] = 'yellow';
                        used[j] = true;
                        break;
                    }
                }
            }

            let display = '';
            for (let i = 0; i < target.length; i++) {
                if (result[i] === 'green') {
                    display += target[i];
                } else if (result[i] === 'yellow') {
                    display += target[i].toLowerCase();
                } else {
                    display += '_';
                }
            }
            return display;
        }

        function checkSudoku() {
            const puzzle = gameData.puzzle;
            const solution = gameData.solution;
            let correct = true;

            document.querySelectorAll('.sudoku-cell:not(.fixed)').forEach(cell => {
                const r = parseInt(cell.dataset.pos[0]);
                const c = parseInt(cell.dataset.pos[1]);
                const val = cell.dataset.value !== '' ? parseInt(cell.dataset.value) : 0;
                if (val !== solution[r][c]) {
                    correct = false;
                    cell.classList.add('error');
                }
            });

            if (correct) {
                alert('🎉 Sudoku solved correctly!');
            }
        }

        // ==========================================
        // MINI CROSSWORD RENDERING & LOGIC
        // ==========================================
        function newCrosswordGame() {
            const puzzle = crosswordPuzzles[Math.floor(Math.random() * crosswordPuzzles.length)];
            gameData = { grid: puzzle.grid, cluesAcross: puzzle.cluesAcross, cluesDown: puzzle.cluesDown };
        }

        function renderCrosswordUI() {
            const { grid, cluesAcross, cluesDown } = gameData;

            let gridHTML = '';
            for (let r = 0; r < 5; r++) {
                gridHTML += '<div class="crossword-grid">';
                for (let c = 0; c < 5; c++) {
                    const cellClass = grid[r][c] ? 'clue' : '';
                    gridHTML += `<div class="crossword-cell ${cellClass}">${grid[r][c] || ''}</div>`;
                }
                gridHTML += '</div>';
            }

            const acrossHTML = cluesAcross.map(([num, clue]) => `<div><strong>${num}:</strong> ${clue}</div>`).join('');
            const downHTML = cluesDown.map(([num, clue]) => `<div><strong>${num}:</strong> ${clue}</div>`).join('');

            return `
                <div class="crossword-game">
                    <div class="crossword-grid">${gridHTML}</div>
                    <div class="clues">
                        <h4>Across</h4>${acrossHTML}
                        <h4>Down</h4>${downHTML}
                    </div>
                </div>
            `;
        }

        function setupCrosswordListeners() {
            document.querySelectorAll('.crossword-cell').forEach(cell => {
                cell.addEventListener('click', function() {
                    // Toggle between empty and next character
                    if (this.textContent === '') {
                        this.textContent = 'A';
                    } else if (this.textContent === 'Z') {
                        this.textContent = '';
                    } else {
                        this.textContent = String.fromCharCode(this.textContent.charCodeAt(0) + 1);
                    }
                });
            });
        }

        // ==========================================
        // 2048 RENDERING & LOGIC
        // ==========================================
        function new2048Game() {
            gameData = createNew2048Game();
        }

        function render2048UI() {
            const { grid, score, hasWon, gameOver } = gameData;
            let tiles = '';

            grid.forEach(row => {
                tiles += '<div class="twenty48-board">';
                row.forEach(val => {
                    const tileClass = val ? '' : 'empty';
                    tiles += `<div class="twenty48-tile${val ? '' : ' empty'}">${val || ''}</div>`;
                });
                tiles += '</div>';
            });

            const gameOverHTML = gameOver && !hasWon ?
                '<div style="text-align:center; margin-top:2rem; color:red;">Game Over</div>' :
                '';

            const winHTML = hasWon && !gameOver ?
                '<div style="text-align:center; margin-top:2rem; color:var(--success)">🎉 You reached 2048!</div>' :
                '';

            return `
                <div class="twenty48-game">
                    <div class="twenty48-board">${tiles}</div>
                    <p>Score: <span>${score}</span></p>
                    ${winHTML}${gameOverHTML}
                    <div class="twenty48-controls">
                        <button class="twenty48-btn" onclick="move2048('up')">↑</button>
                        <button class="twenty48-btn" onclick="move2048('left')">←</button>
                        <button class="twenty48-btn" onclick="move2048('right')">→</button>
                        <button class="twenty48-btn" onclick="move2048('down')">↓</button>
                    </div>
                </div>
            `;
        }

        function setup2048Listeners() {
            document.querySelectorAll('.twenty48-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const dir = btn.dataset.direction;
                    if (dir) {
                        const result = move2048(gameData.grid, dir);
                        gameData = {
                            ...gameData,
                            grid: result.grid,
                            score: gameData.score + result.score,
                            hasWon: result.hasWon || gameData.hasWon,
                            gameOver: check2048GameOver(result.grid) && !result.hasWon
                        };
                        render2048UI();
                    }
                });
            });

            // Physical keyboard support
            document.body.addEventListener('keydown', e => {
                if (e.key === 'ArrowUp' || e.key === 'w') move2048('up');
                if (e.key === 'ArrowLeft' || e.key === 'a') move2048('left');
                if (e.key === 'ArrowRight' || e.key === 'd') move2048('right');
                if (e.key === 'ArrowDown' || e.key === 's') move2048('down');
            });
        }

        function resetToGameSelector() {
            currentGame = null;
            gameData = {};
            document.getElementById('gamesGrid').style.display = 'grid';
            document.getElementById('activeGame').innerHTML = '';
            renderGameSelector();
        }

        // ==========================================
        // MINESWEEPER RENDERING & LOGIC
        // ==========================================
        function newMinesweeperGame() {
            gameData = createMinesweeperGame(9, 10);
        }

        function renderMinesweeperUI() {
            const { grid, size, revealed, flags } = gameData;
            let cells = '';

            for (let r = 0; r < size; r++) {
                cells += '<div>';
                for (let c = 0; c < size; c++) {
                    const key = `${r},${c}`;
                    const isMine = grid[r][c] === -1;
                    const isRevealed = revealed.has(key);
                    const isFlagged = flags.has(key);

                    if (isMine && isRevealed) {
                        cells += `<div class="minesweeper-cell mine" data-key="${key}">💣</div>`;
                    } else if (isFlagged) {
                        cells += `<div class="minesweeper-cell flagged" data-key="${key}">🚩</div>`;
                    } else if (isRevealed) {
                        const val = grid[r][c];
                        cells += `<div class="minesweeper-cell number-${val || ''}" data-key="${key}">${val || ''}</div>`;
                    } else {
                        cells += `<div class="minesweeper-cell" data-key="${key}" onclick="revealCell(gameData, '${key}')" oncontextmenu="toggleFlag(gameData, '${key}'); return false;"></div>`;
                    }
                }
                cells += '</div>';
            }

            const mineCount = game.grid.flat().filter(x => x === -1).length;
            return `
                <div class="minesweeper-game">
                    <div class="mine-count">Mines: ${mineCount - flags.size}</div>
                    <div class="minesweeper-grid">${cells}</div>
                </div>
            `;
        }

        function setupMinesweeperListeners() {
            // Click listeners are set inline in the render function
            // Right-click for flagging is handled via oncontextmenu
        }

        function resetToGameSelector() {
            currentGame = null;
            gameData = {};
            document.getElementById('gamesGrid').style.display = 'grid';
            document.getElementById('activeGame').innerHTML = '';
            renderGameSelector();
        }

        // ==========================================
        // GAME SELECTION & NAVIGATION
        // ==========================================

        function renderGameSelector() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            const games = [
                { id: 'wordle', name: 'Wordle', icon: '🟢' },
                { id: 'spellingbee', name: 'Spelling Bee', icon: '🍯' },
                { id: 'connections', name: 'Connections', icon: '🔗' },
                { id: 'sudoku', name: 'Sudoku', icon: '🧩' },
                { id: 'crossword', name: 'Mini Crossword', icon: '🧩' },
                { id: 'twenty48', name: '2048', icon: '🔢' },
                { id: 'minesweeper', name: 'Minesweeper', icon: '💣' }
            ];

            games.forEach(game => {
                const div = document.createElement('div');
                div.className = 'game-card';
                div.innerHTML = `<div class="game-icon">${game.icon}</div><div class="game-name">${game.name}</div>`;
                div.addEventListener('click', () => startGame(game.id));
                grid.appendChild(div);
            });
        }

        function startGame(gameId) {
            currentGame = gameId;
            const activeGame = document.getElementById('activeGame');
            activeGame.innerHTML = '<div class="loading">Loading game...</div>';

            switch (gameId) {
                case 'wordle': newWordleGame(); break;
                case 'spellingbee': newSpellingBeeGame(); break;
                case 'connections': newConnectionsGame(); break;
                case 'sudoku': newSudokuGame(); break;
                case 'crossword': newCrosswordGame(); break;
                case 'twenty48': new2048Game(); break;
                case 'minesweeper': newMinesweeperGame(); break;
            }

            setTimeout(() => renderGameUI(gameId), 300);
        }

        function resetToGameSelector() {
            currentGame = null;
            gameData = {};
            document.getElementById('gamesGrid').style.display = 'grid';
            document.getElementById('activeGame').innerHTML = '';
            renderGameSelector();
        }

        // Initialize
        window.onload = () => {
            renderGameSelector();
        };
    </script>
</body>
