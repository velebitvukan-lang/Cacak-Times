<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacak Times - Word & Logic Games</title>
    <style>
        :root {
            --primary: #e50914;
            --secondary: #ffcd00;
            --tertiary: #2b9d1e;
            --bg: #0d0d0d;
            --card: #1a1a1a;
            --text: #ffffff;
            --muted: #888888;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary), #c40e18);
            padding: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: 2px;
        }

        header h1 span { display: block; }
        header p { color: var(--muted); margin-top: 0.5rem; font-size: 1rem; }

        main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        .game-selector { margin-bottom: 3rem; }
        .game-selector h2 { margin-bottom: 1.5rem; font-size: 1.5rem; color: var(--secondary); }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
        }

        .game-card {
            background: var(--card);
            border: 2px solid var(--muted);
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .game-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .game-card:hover .game-icon { transform: scale(1.1); }

        .game-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        .game-name { font-size: 1rem; color: var(--text); }

        .active-game {
            min-height: 400px;
            background: var(--card);
            border-radius: 10px;
            padding: 2rem;
            margin-top: 2rem;
        }

        .loading { text-align: center; color: var(--muted); padding: 2rem; }
        .error { color: #ff5252; padding: 2rem; text-align: center; }

        /* Wordle */
        .wordle-game { max-width: 600px; margin: 0 auto; }
        .word-mask { font-size: 2rem; letter-spacing: 1rem; margin: 1rem 0; min-height: 3rem; }
        .keyboard { display: grid; grid-template-columns: repeat(9, 1fr); gap: 0.5rem; margin: 1rem 0; }
        .letter-btn {
            background: var(--card); border: 1px solid var(--muted); color: var(--text);
            padding: 0.5rem; border-radius: 5px; cursor: pointer; font-size: 0.8rem;
        }
        .letter-btn:hover { border-color: var(--primary); }
        .letter-btn.pressed { background: var(--primary); color: white; }
        .attempts { margin-top: 1rem; font-size: 0.9rem; color: var(--muted); }

        /* Spelling Bee */
        .spelling-bee-game { max-width: 500px; margin: 0 auto; }
        .honeycomb { display: flex; justify-content: center; gap: 1rem; margin: 1rem 0; flex-wrap: wrap; }
        .bee-cell { width: 40px; height: 40px; background: var(--card); border: 2px solid var(--muted); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--text); min-width: 40px; }
        .bee-cell.center { border-color: var(--secondary); color: var(--primary); }
        .spelling-bee-game input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; background: var(--bg); border: 1px solid var(--muted); color: var(--text); border-radius: 5px; }
        .spelling-bee-game button { padding: 0.5rem 1rem; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; }
        .spelling-bee-game button:hover { background: #c40e18; }
        .spelling-bee-game #results { margin-top: 1rem; font-size: 0.9rem; }

        /* Connections */
        .connections-game { max-width: 800px; margin: 0 auto; }
        .words-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 0.5rem; margin: 1rem 0; }
        .connect-word { background: var(--card); border: 1px solid var(--muted); color: var(--text); padding: 0.5rem; border-radius: 5px; cursor: pointer; font-size: 0.8rem; text-align: center; }
        .connect-word.selected { border-color: var(--secondary); background: var(--secondary); color: var(--bg); }
        .categories { margin-top: 1rem; font-size: 0.9rem; color: var(--muted); }
        .connections-game button { padding: 0.5rem 1rem; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 1rem; }
        .connections-game button:hover { background: #c40e18; }

        /* Sudoku */
        .sudoku-game { max-width: 500px; margin: 0 auto; }
        .sudoku-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 1px; background: #333; }
        .sudoku-row { display: flex; }
        .sudoku-cell { width: 40px; height: 40px; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; }
        .sudoku-cell.hint { color: var(--muted); }
        .sudoku-game button { padding: 0.5rem 1rem; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 1rem; }

        /* Crossword */
        .crossword-game { max-width: 400px; margin: 0 auto; }
        .crossword-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; width: fit-content; margin: 0 auto; }
        .crossword-row { display: flex; }
        .crossword-cell { width: 50px; height: 50px; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold; border: 1px solid var(--muted); }
        .clues { margin-top: 1rem; }
        .clues h4 { margin: 0.5rem 0; font-size: 0.8rem; }
        .clues div { margin: 0.2rem 0; font-size: 0.7rem; }

        /* 2048 */
        .twenty48-game { max-width: 500px; margin: 0 auto; }
        .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: fit-content; margin: 1rem auto; }
        .row { display: flex; }
        .tile { background: var(--bg); color: var(--text); min-height: 40px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; border-radius: 5px; }
        .controls { display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; }
        .controls button { padding: 0.5rem 1rem; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        .controls button:hover { background: #c40e18; }

        /* Minesweeper */
        .minesweeper-game { max-width: 600px; margin: 0 auto; }
        .board .row { display: flex; }
        .minesweeper-cell { width: 35px; height: 35px; background: var(--bg); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; border: 1px solid var(--muted); cursor: pointer; }
        .minesweeper-cell.mine { background: #ff5252; color: white; }
        .minesweeper-game p { text-align: center; margin: 1rem 0; color: var(--muted); }
        .minesweeper-game button { padding: 0.5rem 1rem; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; }

        footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.9rem; margin-top: 3rem; }
    </style>
</head>
<body>

    <header>
        <h1><span style="color: #e50914;">C</span><span style="color: #ffcd00;">ac</span><span style="color: #2b9d1e;">k</span> Times</h1>
        <p>Word & Logic Games Hub</p>
    </header>

    <main>
        <section class="game-selector">
            <h2>Select a Game</h2>
            <div class="games-grid" id="gamesGrid">
                <!-- Games loaded by JavaScript -->
            </div>
        </section>

        <section class="active-game" id="activeGame">
            <!-- Game UI inserted by JavaScript -->
        </section>
    </main>

    <footer>
        <p>Cacak Times • Static Site • GitHub Pages</p>
    </footer>

    <script>
        // ============================================================
        // GAME DATA - Embedded for client-side play
        // ============================================================

        // Word List for Wordle
        const WORD_LIST = [
            "apple", "berry", "cherry", "dragon", "eagle", "frank", "grape",
            "honey", "ilium", "jelly", "kangaroo", "lemon", "mango", "nutmeg",
            "orange", "peach", "queen", "raspberry", "strawberry", "tangerine",
            "umber", "vanilla", "watermelon", "xenon", "yacht", "zebra"
        ];

        // Game state
        let currentGame = null;
        let gameData = {};

        // ============================================================
        // GAME LOGIC FUNCTIONS
        // ============================================================

        // ---- Wordle Logic ----
        function getRandomWord() {
            return WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];
        }

        function maskWord(word) {
            return '_'.repeat(word.length);
        }

        function validateWordGuess(word, targetWord) {
            if (word.length !== targetWord.length) return null;
            const result = [];
            const usedTarget = [];

            // First pass: exact matches (green)
            for (let i = 0; i < word.length; i++) {
                if (word[i] === targetWord[i]) {
                    result.push('green');
                    usedTarget[i] = true;
                } else {
                    result.push('gray');
                }
            }

            // Second pass: correct letter, wrong position (yellow)
            for (let i = 0; i < word.length; i++) {
                if (result[i] === 'green') continue;
                for (let j = 0; j < targetWord.length; j++) {
                    if (!usedTarget[j] && word[i] === targetWord[j]) {
                        result[i] = 'yellow';
                        usedTarget[j] = true;
                        break;
                    }
                }
            }

            return result;
        }

        // ---- Spelling Bee Logic ----
        function generateSpellingBeeGrid() {
            const vowels = new Set("aeiou");
            const consonants = "bcdfghjklmnpqrstvwxyz";

            const center = Array.from(vowels)[Math.floor(Math.random() * 5)];
            const consonantArray = consonants.split('');
            const shuffledConsonants = consonantArray.sort(() => 0.5 - Math.random);
            const pickedConsonants = shuffledConsonants.slice(0, 3);

            const remainingVowels = Array.from(vowels).filter(v => v !== center);
            const pickedVowels = [];
            while (pickedVowels.length < 2 && remainingVowels.length > 0) {
                const randIdx = Math.floor(Math.random() * remainingVowels.length);
                pickedVowels.push(remainingVowels.splice(randIdx, 1)[0]);
            }

            const allLetters = [center, ...pickedConsonants, ...pickedVowels];
            for (let i = allLetters.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allLetters[i], allLetters[j]] = [allLetters[j], allLetters[i]];
            }

            return { grid: allLetters, center };
        }

        function isValidSpellingBeeWord(word, grid, center) {
            if (word.length < 4) return false;
            if (!word.toLowerCase().includes(center)) return false;
            const wordSet = new Set(word.toLowerCase());
            for (const letter of wordSet) {
                if (!grid.includes(letter)) return false;
            }
            return true;
        }

        // ---- Connections Logic ----
        function getConnectionsWords() {
            const allWords = [
                "apple", "banana", "carrot", "donut", "egg", "flour", "grape",
                "honey", "ice", "jam", "knife", "lemon", "melon", "nut", "olive",
                "pie", "quiche", "rice", "sugar", "tea", "umbrella", "vanilla",
                "wine", "xigua", "yam", "zucchini"
            ];

            const shuffled = allWords.sort(() => 0.5 - Math.random);
            const selected = shuffled.slice(0, 16);

            const categories = {
                YELLOW: selected.slice(0, 4),
                GREEN: selected.slice(4, 8),
                BLUE: selected.slice(8, 12),
                PURPLE: selected.slice(12, 16)
            };

            return { words: selected, categories };
        }

        // ---- Sudoku Logic ----
        function generateSudoku() {
            const grid = new Array(9).fill(null).map(() => new Array(9).fill(0));

            function isValid(g, row, col, num) {
                if (g[row].includes(num)) return false;
                for (let i = 0; i < 9; i++) {
                    if (g[i][col] === num) return false;
                }
                const boxRow = 3 * Math.floor(row / 3);
                const boxCol = 3 * Math.floor(col / 3);
                for (let i = boxRow; i < boxRow + 3; i++) {
                    for (let j = boxCol; j < boxCol + 3; j++) {
                        if (g[i][j] === num) return false;
                    }
                }
                return true;
            }

            function solve(g) {
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        if (g[i][j] === 0) {
                            const nums = [1,2,3,4,5,6,7,8,9].sort(() => 0.5 - Math.random);
                            for (const num of nums) {
                                if (isValid(g, i, j, num)) {
                                    g[i][j] = num;
                                    if (solve(g)) return true;
                                    g[i][j] = 0;
                                }
                            }
                            return false;
                        }
                    }
                }
                return true;
            }

            const solution = g.map(row => row.map(x => x));
            solve(grid);

            const puzzle = grid.map(row => row.map(val => val));
            const cells = [];
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    cells.push({ row: i, col: j });
                }
            }
            for (let i = cells.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cells[i], cells[j]] = [cells[j], cells[i]];
            }
            for (let i = 0; i < 40; i++) {
                const { row, col } = cells[i];
                puzzle[row][col] = 0;
            }

            return { puzzle, solution };
        }

        // ---- Mini Crossword Logic ----
        function generateMiniCrossword() {
            const words = [
                ["hello", 0, 0], ["world", 0, 2], ["python", 2, 0],
                ["flask", 2, 3], ["games", 4, 1], ["code", 1, 4], ["fun", 3, 4]
            ];

            const grid = new Array(5).fill(null).map(() => new Array(5).fill(""));
            const cluesAcross = [];
            const cluesDown = [];

            for (const [word, row, col] of words) {
                if (col + word.length <= 5) {
                    for (let i = 0; i < word.length; i++) grid[row][col + i] = word[i];
                    cluesAcross.push(`Across: ${word}`);
                }
                if (row + word.length <= 5) {
                    for (let i = 0; i < word.length; i++) grid[row + i][col] = word[i];
                    cluesDown.push(`Down: ${word}`);
                }
            }

            return { grid, cluesAcross, cluesDown };
        }

        // ---- 2048 Logic ----
        function new2048Game() {
            const grid = new Array(4).fill(null).map(() => new Array(4).fill(0));
            for (let i = 0; i < 2; i++) {
                const empties = [];
                for (let r = 0; r < 4; r++)
                    for (let c = 0; c < 4; c++)
                        if (grid[r][c] === 0) empties.push({ r, c });
                if (empties.length > 0) {
                    const { r, c } = empties[Math.floor(Math.random() * empties.length)];
                    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
                }
            }
            return grid;
        }

        function move2048(grid, direction) {
            let newGrid = grid.map(row => row.map(x => x));
            let score = 0;

            let dr = 0, dc = 0;
            if (direction === 'up') dr = -1;
            else if (direction === 'down') dr = 1;
            else if (direction === 'left') dc = -1;
            else if (direction === 'right') dc = 1;

            if (dr !== 0) {
                for (let col = 0; col < 4; col++) {
                    const colValues = [];
                    for (let row = 0; row < 4; row++)
                        if (grid[row][col] !== 0) colValues.push(grid[row][col]);

                    const merged = [];
                    let skip = false;
                    for (let i = 0; i < colValues.length; i++) {
                        if (skip) { skip = false; continue; }
                        if (i < colValues.length - 1 && colValues[i] === colValues[i + 1]) {
                            merged.push(colValues[i] * 2);
                            score += colValues[i] * 2;
                            skip = true;
                        } else {
                            merged.push(colValues[i]);
                        }
                    }
                    while (merged.length < 4) merged.unshift(0);

                    for (let row = 0; row < 4; row++) newGrid[row][col] = merged[row];
                }
            } else {
                for (let row = 0; row < 4; row++) {
                    const rowValues = [];
                    for (let col = 0; col < 4; col++)
                        if (grid[row][col] !== 0) rowValues.push(grid[row][col]);

                    const merged = [];
                    let skip = false;
                    for (let i = 0; i < rowValues.length; i++) {
                        if (skip) { skip = false; continue; }
                        if (i < rowValues.length - 1 && rowValues[i] === rowValues[i + 1]) {
                            merged.push(rowValues[i] * 2);
                            score += rowValues[i] * 2;
                            skip = true;
                        } else {
                            merged.push(rowValues[i]);
                        }
                    }
                    while (merged.length < 4) merged.unshift(0);

                    for (let col = 0; col < 4; col++) newGrid[row][col] = merged[col];
                }
            }

            return { grid: newGrid, score };
        }

        // ---- Minesweeper Logic ----
        function newMinesweeper(size = 9, numMines = 10) {
            const grid = new Array(size).fill(null).map(() => new Array(size).fill(0));
            const mines = new Set();

            while (mines.size < numMines) {
                const r = Math.floor(Math.random() * size);
                const c = Math.floor(Math.random() * size);
                mines.add(`${r},${c}`);
            }

            for (const coord of mines) {
                const [r, c] = coord.split(',').map(Number);
                grid[r][c] = -1;
            }

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] !== -1) {
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                if (dr === 0 && dc === 0) continue;
                                const nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < size && nc >= 0 && nc < size && grid[nr][nc] === -1) count++;
                            }
                        }
                        grid[r][c] = count;
                    }
                }
            }
            return grid;
        }

        // ============================================================
        // UI RENDERING FUNCTIONS
        // ============================================================

        function renderGameSelector() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            const games = [
                { id: 'wordle', name: 'Wordle', icon: '🟢' },
                { id: 'spellingbee', name: 'Spelling Bee', icon: '🍯' },
                { id: 'connections', name: 'Connections', icon: '🔗' },
                { id: 'sudoku', name: 'Sudoku', icon: '𧋼' },
                { id: 'crossword', name: 'Mini Crossword', icon: '🧩' },
                { id: 'twenty48', name: '2048', icon: '🔢' },
                { id: 'minesweeper', name: 'Minesweeper', icon: '💣' }
            ];

            games.forEach(game => {
                const div = document.createElement('div');
                div.className = 'game-card';
                div.innerHTML = `<div class="game-icon">${game.icon}</div><div class="game-name">${game.name}</div>`;
                div.addEventListener('click', () => startGame(game.id));
                grid.appendChild(div);
            });
        }

        function startGame(gameId) {
            document.getElementById('gamesGrid').style.display = 'none';
            const activeGame = document.getElementById('activeGame');
            activeGame.innerHTML = '<div class="loading">Loading game...</div>';

            currentGame = gameId;

            switch (gameId) {
                case 'wordle': newWordleGame(); break;
                case 'spellingbee': newSpellingBeeGame(); break;
                case 'connections': newConnectionsGame(); break;
                case 'sudoku': newSudokuGame(); break;
                case 'crossword': newCrosswordGame(); break;
                case 'twenty48': new2048Game(); break;
                case 'minesweeper': newMinesweeperGame(); break;
            }

            setTimeout(() => renderGameUI(gameId), 500);
        }

        function newWordleGame() {
            const word = getRandomWord();
            gameData = { word, masked: maskWord(word), currentPuzzle: 1 };
        }

        function newSpellingBeeGame() {
            const result = generateSpellingBeeGrid();
            gameData = { grid: result.grid, center: result.center };
        }

        function newConnectionsGame() {
            const result = getConnectionsWords();
            gameData = { words: result.words, categories: result.categories };
        }

        function newSudokuGame() {
            const result = generateSudoku();
            gameData = { puzzle: result.puzzle, solution: result.solution };
        }

        function newCrosswordGame() {
            const result = generateMiniCrossword();
            gameData = { grid: result.grid, cluesAcross: result.cluesAcross, cluesDown: result.cluesDown };
        }

        function new2048Game() {
            gameData = { grid: new2048Game(), score: 0 };
        }

        function newMinesweeperGame() {
            gameData = { grid: newMinesweeper(9, 10), size: 9 };
        }

        function renderGameUI(gameId) {
            const container = document.getElementById('activeGame');
            const uiMap = {
                wordle: renderWordleUI,
                spellingbee: renderSpellingBeeUI,
                connections: renderConnectionsUI,
                sudoku: renderSudokuUI,
                crossword: renderCrosswordUI,
                twenty48: render2048UI,
                minesweeper: renderMinesweeperUI
            };

            if (uiMap[gameId]) {
                container.innerHTML = uiMap[gameId]();
                setupGameListeners(gameId);
            } else {
                container.innerHTML = '<div class="error">Game not available</div>';
            }
        }

        function renderWordleUI() {
            const { word, masked } = gameData;
            let letters = '';
            for (let i = 0; i < 26; i++)
                letters += `<button class="letter-btn" data-letter="${String.fromCharCode(65+i)}">${String.fromCharCode(65+i)}</button>`;

            return `
                <div class="wordle-game">
                    <h3>Wordle #${gameData.currentPuzzle}</h3>
                    <div class="word-mask" id="wordMask">${masked}</div>
                    <div class="keyboard">${letters}</div>
                    <div class="attempts" id="attempts"></div>
                </div>
            `;
        }

        function renderSpellingBeeUI() {
            const { grid, center } = gameData;
            let cells = '';
            grid.forEach((letter, i) => {
                const isCenter = i === 3;
                cells += `<div class="bee-cell${isCenter ? ' center' : ''}" data-letter="${letter}">${letter}</div>`;
            });

            return `
                <div class="spelling-bee-game">
                    <h3>Spelling Bee</h3>
                    <div class="honeycomb">${cells}</div>
                    <p>Center letter: <span style="color: #ffd700;">${center}</span></p>
                    <p>Words must be 4+ letters and include the center</p>
                    <input type="text" id="spellingWord" placeholder="Enter word...">
                    <button onclick="validateSpellingWord()">Submit</button>
                    <div id="results"></div>
                </div>
            `;
        }

        function renderConnectionsUI() {
            const { words, categories } = gameData;
            let wordButtons = '';
            words.forEach(word => wordButtons += `<button class="connect-word" data-word="${word}">${word}</button>`);

            let catsHTML = '';
            for (const [key, w] of Object.entries(categories))
                catsHTML += `<div><strong>${key}:</strong> ${w.join(', ')}</div>`;

            return `
                <div class="connections-game">
                    <h3>Connections</h3>
                    <div class="words-grid">${wordButtons}</div>
                    <div class="categories">${catsHTML}</div>
                    <button onclick="submitConnectionsGuess()">Submit Groups</button>
                </div>
            `;
        }

        function renderSudokuUI() {
            const { puzzle } = gameData;
            let gridHTML = '';
            for (let r = 0; r < 9; r++) {
                gridHTML += '<div class="sudoku-row">';
                for (let c = 0; c < 9; c++) {
                    const val = puzzle[r][c] || '';
                    const isHint = puzzle[r][c] !== 0;
                    gridHTML += `<div class="sudoku-cell${isHint ? ' hint' : ''}" data-pos="${r}${c}">${val}</div>`;
                }
                gridHTML += '</div>';
            }
            return `<div class="sudoku-game"><h3>Sudoku</h3><div class="sudoku-grid">${gridHTML}</div><button onclick="resetSudoku()">New Puzzle</button></div>`;
        }

        function renderCrosswordUI() {
            const { grid, cluesAcross, cluesDown } = gameData;
            let gridHTML = '';
            for (let r = 0; r < 5; r++) {
                gridHTML += '<div class="crossword-row">';
                for (let c = 0; c < 5; c++) gridHTML += `<div class="crossword-cell">${grid[r][c] || ''}</div>`;
                gridHTML += '</div>';
            }
            const acrossHTML = cluesAcross.map(([num, clue]) => `<div><strong>${num}:</strong> ${clue}</div>`).join('');
            const downHTML = cluesDown.map(([num, clue]) => `<div><strong>${num}:</strong> ${clue}</div>`).join('');
            return `
                <div class="crossword-game">
                    <h3>Mini Crossword</h3>
                    <div class="crossword-grid">${gridHTML}</div>
                    <div class="clues"><h4>Across</h4>${acrossHTML}<h4>Down</h4>${downHTML}</div>
                </div>
            `;
        }

        function render2048UI() {
            const { grid, score } = gameData;
            let tiles = '';
            grid.forEach(row => {
                tiles += '<div class="row">';
                row.forEach(val => tiles += `<div class="tile">${val || ''}</div>`);
                tiles += '</div>';
            });
            return `
                <div class="twenty48-game">
                    <h3>2048</h3>
                    <div class="board">${tiles}</div>
                    <p>Score: <span id="2048Score">${score}</span></p>
                    <div class="controls">
                        <button onclick="move2048('up')">↑</button>
                        <button onclick="move2048('left')">←</button>
                        <button onclick="move2048('right')">→</button>
                        <button onclick="move2048('down')">↓</button>
                    </div>
                </div>
            `;
        }

        function renderMinesweeperUI() {
            const { grid, size } = gameData;
            let cells = '';
            for (let r = 0; r < size; r++) {
                cells += '<div class="row">';
                for (let c = 0; c < size; c++) {
                    const val = grid[r][c];
                    const isMine = val === -1;
                    cells += `<div class="minesweeper-cell${isMine ? ' mine' : ''}" data-row="${r}" data-col="${c}">${isMine ? '💣' : (val || '')}</div>`;
                }
                cells += '</div>';
            }
            return `
                <div class="minesweeper-game">
                    <h3>Minesweeper</h3>
                    <p>Find all safe cells without hitting a mine</p>
                    <div class="board">${cells}</div>
                    <div class="controls"><button onclick="newMinesweeper()">New Game</button></div>
                </div>
            `;
        }

        // ============================================================
        // GAME LISTENERS
        // ============================================================

        function setupGameListeners(gameId) {
            switch (gameId) {
                case 'wordle': setupWordleListeners(); break;
                case 'spellingbee': setupSpellingBeeListeners(); break;
                case 'connections': setupConnectionsListeners(); break;
                case 'sudoku': setupSudokuListeners(); break;
                case 'crossword': setupCrosswordListeners(); break;
                case 'twenty48': setup2048Listeners(); break;
                case 'minesweeper': setupMinesweeperListeners(); break;
            }
        }

        function setupWordleListeners() {
            document.querySelectorAll('.letter-btn').forEach(btn => {
                btn.addEventListener('click', () => btn.classList.add('pressed'));
            });
        }

        function setupSpellingBeeListeners() {
            document.getElementById('spellingWord').addEventListener('keydown', e => { if (e.key === 'Enter') validateSpellingWord(); });
        }

        function validateSpellingWord() {
            const word = document.getElementById('spellingWord').value.trim();
            if (!word) return;
            const result = isValidSpellingBeeWord(word, gameData.grid, gameData.center);
            document.getElementById('results').innerHTML = result ? '<span style="color: green;">✓ Valid!</span>' : '<span style="color: red;">✗ Not valid</span>';
        }

        function setupConnectionsListeners() {
            document.querySelectorAll('.connect-word').forEach(btn => {
                btn.addEventListener('click', () => btn.classList.toggle('selected'));
            });
        }

        function submitConnectionsGuess() {
            const selected = document.querySelectorAll('.connect-word.selected');
            if (selected.length !== 4) { alert('Select exactly 4 words'); return; }
            const words = Array.from(selected).map(btn => btn.dataset.word);
            let found = false;
            for (const [cat, w] of Object.entries(gameData.categories)) {
                const inCat = words.filter(word => w.includes(word));
                if (inCat.length >= 2) { alert(`✓ "${words.join(', ')}" are in the "${cat}" category!`); found = true; break; }
            }
            if (!found) alert('✗ Those words don\'t match a category. Try again!');
        }

        function setupSudokuListeners() {
            document.querySelectorAll('.sudoku-cell').forEach(cell => {
                cell.addEventListener('click', () => {
                    cell.textContent = Math.floor(Math.random() * 9) + 1;
                });
            });
        }

        function resetSudoku() { newSudokuGame(); renderSudokuUI(); setupSudokuListeners(); }

        function setup2048Listeners() {
            document.querySelectorAll('.controls button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const dir = btn.dataset.direction;
                    if (dir) {
                        const result = move2048(gameData.grid, dir);
                        gameData = { grid: result.grid, score: gameData.score + result.score };
                        render2048UI();
                    }
                });
            });
        }

        function setupMinesweeperListeners() {
            document.querySelectorAll('.minesweeper-cell:not(.mine)').forEach(cell => {
                cell.addEventListener('click', () => {
                    cell.style.background = '#2a2a2a';
                });
            });
        }

        window.newMinesweeper = function() {
            newMinesweeperGame();
            renderMinesweeperUI();
            setupMinesweeperListeners();
        };

        // Initialize
        window.onload = () => { renderGameSelector(); };
    </script>
</body>
</html>
